name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.4.0, v1.5.0-rc

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare version and tags
        id: prep
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Base tag with the exact version
          DOCKER_TAGS="kacper1263/pangolin-watchdog:$VERSION"
          
          # Append 'latest' tag only if it's a stable release (no hyphens like -rc or -beta)
          if [[ "$VERSION" != *-* ]]; then
            DOCKER_TAGS="$DOCKER_TAGS,kacper1263/pangolin-watchdog:latest"
          fi
          
          echo "DOCKER_TAGS=$DOCKER_TAGS" >> $GITHUB_ENV

      - name: Build and push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false # Prevents generating unknown/empty attestation tags
          tags: ${{ env.DOCKER_TAGS }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}