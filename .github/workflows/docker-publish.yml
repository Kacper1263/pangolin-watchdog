name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*' # run only on tags starting with "v" (eg. v1.4.0)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clone code
        uses: actions/checkout@v4

      - name: 2. Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Get version tag
        id: get_version
        # removes "refs/tags/" leaving only "v1.3.0"
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: 5. Build and send to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            kacper1263/pangolin-watchdog:${{ env.VERSION }}
            kacper1263/pangolin-watchdog:latest
          build-args: |
            APP_VERSION=${{ env.VERSION }}
